$kind: http-request
description: ""
url: "{{baseUrl}}/api/courses/removeStudent/:courseId"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: courseId
    value: "2"
    description: Id of the course.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "studentId": 1
    }
  $type: |-
    {
      "description": "Identifies the student to take off a course roster.",
      "type": "object",
      "properties": {
        "studentId": {
          "type": "integer",
          "example": 1,
          "description": "Id of the student.",
          "format": "int64"
        }
      },
      "required": [
        "studentId"
      ]
    }
scripts:
  - type: afterResponse
    code: "const Ajv = require('ajv');\r

      const spec = JSON.parse(pm.collectionVariables.get('contract'));\r

      const ajv = new Ajv({\r

      allErrors: true,\r

      unknownFormats: 'ignore',\r

      schemaId: 'auto',\r

      validateSchema: false,\r

      logger: false\r

      });\r

      ajv.addSchema(spec, 'spec');\r

      pm.test('Body matches CourseResponse', () => {\r

      const valid = ajv.validate(\r

      { $ref: 'spec#/components/schemas/CourseResponse' },\r

      pm.response.json()\r

      );\r

      pm.expect(valid, ajv.errorsText()).to.be.true;\r

      });"
    language: text/javascript
settings: {}
examples: .resources/Remove a student from a course (200).resources/examples
order: 12000
