$kind: http-request
description: Returns the full details of each course the student is enrolled in.
url: "{{baseUrl}}/api/students/:id/courses"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "99"
    description: Id of the student.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: "\r

      const Ajv = require('ajv');\r

      const spec = JSON.parse(pm.collectionVariables.get('contract'));\r

      const ajv = new Ajv({\r

      allErrors: true,\r

      unknownFormats: 'ignore',\r

      schemaId: 'auto',\r

      validateSchema: false,\r

      logger: false\r

      });\r

      ajv.addSchema(spec, 'spec');\r

      pm.test('Body matches ErrorResponse', () => {\r

      const valid = ajv.validate(\r

      { $ref: 'spec#/components/schemas/ErrorResponse' },\r

      pm.response.json()\r

      );\r

      pm.expect(valid, ajv.errorsText()).to.be.true;\r

      });\r

      \r

      // Saves the studentId for the delete request\r

      pm.collectionVariables.set('studentId', pm.response.json().id);"
    language: text/javascript
settings: {}
examples: .resources/List a student's courses (400).resources/examples
order: 12000
