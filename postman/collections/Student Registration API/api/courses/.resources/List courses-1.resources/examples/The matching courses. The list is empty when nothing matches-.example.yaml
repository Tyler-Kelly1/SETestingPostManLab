$kind: http-example
name: The matching courses. The list is empty when nothing matches.
request:
  url: "{{baseUrl}}/api/courses?instructorId=2"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: instructorId
      value: "2"
      disabled: false
      description: Return only courses taught by this instructor.
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "id": 1,
          "instructorId": 2,
          "maxSize": 30,
          "name": "CS1",
          "room": "MCS 339",
          "roster": [
            {
              "id": 1,
              "name": "Sherlock Holmes"
            },
            {
              "id": 1,
              "name": "Sherlock Holmes"
            }
          ],
          "status": "OPEN"
        },
        {
          "id": 1,
          "instructorId": 2,
          "maxSize": 30,
          "name": "CS1",
          "room": "MCS 339",
          "roster": [
            {
              "id": 1,
              "name": "Sherlock Holmes"
            },
            {
              "id": 1,
              "name": "Sherlock Holmes"
            }
          ],
          "status": "OPEN"
        }
      ]
    $type: |-
      {
        "type": "array",
        "items": {
          "description": "A course as returned by the API.",
          "type": "object",
          "properties": {
            "id": {
              "type": "integer",
              "example": 1,
              "description": "Unique id assigned by the service.",
              "format": "int64"
            },
            "name": {
              "type": "string",
              "example": "CS1",
              "description": "Name of the course."
            },
            "instructorId": {
              "type": "integer",
              "example": 2,
              "description": "Id of the instructor teaching the course.",
              "format": "int64"
            },
            "maxSize": {
              "type": "integer",
              "example": 30,
              "description": "Maximum number of students the course can hold.",
              "format": "int32"
            },
            "room": {
              "type": "string",
              "example": "MCS 339",
              "description": "Room where the course meets."
            },
            "roster": {
              "type": "array",
              "description": "The students on the roster, with one entry per student.",
              "items": {
                "description": "The short form of a student used in a course roster.",
                "type": "object",
                "properties": {
                  "id": {
                    "type": "integer",
                    "example": 1,
                    "description": "Unique id of the student.",
                    "format": "int64"
                  },
                  "name": {
                    "type": "string",
                    "example": "Sherlock Holmes",
                    "description": "Full name of the student."
                  }
                },
                "required": [
                  "id",
                  "name"
                ]
              }
            },
            "status": {
              "type": "string",
              "enum": [
                "OPEN",
                "CLOSED"
              ],
              "example": "OPEN",
              "description": "Whether the course is accepting enrollments."
            }
          },
          "required": [
            "id",
            "instructorId",
            "maxSize",
            "name",
            "room",
            "roster",
            "status"
          ]
        }
      }
order: 1000
