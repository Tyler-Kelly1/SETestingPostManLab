url: "{{baseUrl}}/api/courses/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "1"
    disabled: false
    description: Id of the course.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
settings: {}
examples: ./.resources/Delete a course-1.resources/examples
order: 3000
