$kind: http-request
name: Delete a student
description: Deletes the student and removes them from the roster of every
  course they are enrolled in.
url: "{{baseUrl}}/api/students/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "5"
    description: Id of the student.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
settings: {}
examples: ./.resources/Delete a student-1.resources/examples
order: 3000
