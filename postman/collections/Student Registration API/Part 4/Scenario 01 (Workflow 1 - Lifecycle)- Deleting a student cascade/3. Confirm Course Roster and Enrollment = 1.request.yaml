$kind: http-request
url: "{{baseUrl}}/api/courses/getEnrollment/{{s1_courseId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Enrollment count is 1', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.eql(1);
      });
    language: text/javascript
order: 3000
