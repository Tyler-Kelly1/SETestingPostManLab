$kind: http-request
url: "{{baseUrl}}/api/students"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Sherlock Holmes",
      "major": "Computer Science",
      "gpa": 3.75,
      "courses": [{{s1_courseId}}]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Student created (201)', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('s1_studentId', pm.response.json().id);
    language: text/javascript
order: 2000
