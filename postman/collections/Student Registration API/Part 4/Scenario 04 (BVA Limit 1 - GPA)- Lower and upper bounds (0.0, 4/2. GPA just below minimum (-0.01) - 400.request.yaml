$kind: http-request
name: 2. GPA just below minimum (-0.01) -> 400
url: "{{baseUrl}}/api/students"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Below Min GPA",
      "major": "Physics",
      "gpa": -0.01
    }
scripts:
  - type: afterResponse
    code: pm.test('GPA -0.01 rejected (400)', () => pm.response.to.have.status(400));
    language: text/javascript
order: 2000
