$kind: http-request
name: 6. Remove Student via PUT /api/courses/removeStudent/{courseId}
url: "{{baseUrl}}/api/courses/removeStudent/{{s2_courseId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "studentId": {{s2_studentId}}
    }
scripts:
  - type: afterResponse
    code: |-
      const studentId = Number(pm.collectionVariables.get('s2_studentId'));
      pm.test('removeStudent returns 200 and removes student', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().roster.map(s => s.id)).to.not.include(studentId);
      });
    language: text/javascript
order: 6000
