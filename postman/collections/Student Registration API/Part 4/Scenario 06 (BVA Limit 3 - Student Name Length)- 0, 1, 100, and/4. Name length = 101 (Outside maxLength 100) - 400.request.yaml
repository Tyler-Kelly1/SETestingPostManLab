$kind: http-request
name: 4. Name length = 101 (Outside maxLength 100) -> 400
url: "{{baseUrl}}/api/students"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "{{name_101}}",
      "major": "CS",
      "gpa": 3.0
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('name_101', 'A'.repeat(101));
    language: text/javascript
  - type: afterResponse
    code: pm.test('101-char name rejected (400)', () => pm.response.to.have.status(400));
    language: text/javascript
order: 4000
