$kind: http-request
name: 3. Name length = 100 (On maxLength 100) -> 201
url: "{{baseUrl}}/api/students"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "{{name_100}}",
      "major": "CS",
      "gpa": 3.0
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('name_100', 'A'.repeat(100));
    language: text/javascript
  - type: afterResponse
    code: pm.test('100-char name accepted (201)', () => pm.response.to.have.status(201));
    language: text/javascript
order: 3000
