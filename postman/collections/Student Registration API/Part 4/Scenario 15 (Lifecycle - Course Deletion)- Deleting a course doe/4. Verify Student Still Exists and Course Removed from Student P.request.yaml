$kind: http-request
name: 4. Verify Student Still Exists and Course Removed from Student Profile
url: "{{baseUrl}}/api/students/{{s15_studentId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Student still exists (200)', () => pm.response.to.have.status(200));
      pm.test('Deleted course is no longer listed on student', () => {
        pm.expect(pm.response.json().courses).to.not.include('Temp-Course-15');
      });
    language: text/javascript
order: 4000
