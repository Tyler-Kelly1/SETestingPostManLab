$kind: http-request
url: "{{baseUrl}}/api/students"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Surviving Student",
      "major": "CS",
      "gpa": 3.6,
      "courses": [{{s15_courseId}}]
    }
scripts:
  - type: afterResponse
    code: pm.collectionVariables.set('s15_studentId', pm.response.json().id);
    language: text/javascript
order: 2000
