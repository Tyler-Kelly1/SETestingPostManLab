$kind: http-request
url: "{{baseUrl}}/api/students"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Preserved Student",
      "major": "CS",
      "gpa": 3.5
    }
scripts:
  - type: afterResponse
    code: pm.collectionVariables.set('s13_studentId', pm.response.json().id);
    language: text/javascript
order: 1000
