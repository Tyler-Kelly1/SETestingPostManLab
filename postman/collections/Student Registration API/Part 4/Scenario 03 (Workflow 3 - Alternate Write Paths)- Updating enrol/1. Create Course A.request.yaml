$kind: http-request
url: "{{baseUrl}}/api/courses"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Course-A-AltPath",
      "maxSize": 10,
      "room": "101"
    }
scripts:
  - type: afterResponse
    code: pm.collectionVariables.set('s3_courseA', pm.response.json().id);
    language: text/javascript
order: 1000
