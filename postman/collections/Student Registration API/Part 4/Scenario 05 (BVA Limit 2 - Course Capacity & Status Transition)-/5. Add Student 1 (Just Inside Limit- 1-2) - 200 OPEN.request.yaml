$kind: http-request
name: "5. Add Student 1 (Just Inside Limit: 1/2) -> 200 OPEN"
url: "{{baseUrl}}/api/courses/addStudent/{{s5_courseId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: "{{s5_stu1}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('1st student added (200)', () => pm.response.to.have.status(200));
      pm.test('Course remains OPEN at 1/2', () => pm.expect(pm.response.json().status).to.eql('OPEN'));
    language: text/javascript
order: 5000
