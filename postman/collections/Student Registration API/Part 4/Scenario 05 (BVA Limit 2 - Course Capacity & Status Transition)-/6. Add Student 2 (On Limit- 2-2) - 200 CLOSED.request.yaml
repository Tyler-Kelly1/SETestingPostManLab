$kind: http-request
name: "6. Add Student 2 (On Limit: 2/2) -> 200 CLOSED"
url: "{{baseUrl}}/api/courses/addStudent/{{s5_courseId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: "{{s5_stu2}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('2nd student added at capacity (200)', () => pm.response.to.have.status(200));
      pm.test('Course transitions to CLOSED at 2/2', () => pm.expect(pm.response.json().status).to.eql('CLOSED'));
    language: text/javascript
order: 6000
